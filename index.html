 return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px"><div style="flex:2 1 320px;min-width:220px"><input aria-label="Buscar pedidos" placeholder="Buscar por número, comprador, teléfono o correo" value="${esc(oq)}" oninput="oq=this.value;ordUp()"></div><div style="flex:1 1 230px;min-width:210px"><select aria-label="Filtrar por estado" onchange="ost=this.value;ordUp()"><option value="activos" ${ost==='activos'?'selected':''}>Pendientes y en curso (sin entregados ni cancelados)</option><option value="" ${ost===''?'selected':''}>Todos los estados</option>${OST.map(x=>`<option value="${x[0]}" ${ost===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div id="ol">${ordList()}</div>`}
const ordMsg=e=>{const c=((e&&e.message)||'').split('|')[0];return c==='final_status'?'Ese pedido está en un estado final y no se puede cambiar.':c==='same_status'?'El pedido ya tiene ese estado.':c==='order_not_found'?'No se encontró el pedido.':null};
async function ordStatus(id){if(busy)return;const o=(OR||[]).find(x=>x.id===id);if(!o)return;const st=$('#os').value,note=$('#on').value;if(st==='cancelado'&&!confirm('¿Cancelar el pedido '+o.order_number+'? Las cantidades reservadas vuelven al stock.'))return;
 busy=true;const r=await sb.rpc('admin_set_order_status',{p_order:id,p_status:st,p_note:note});busy=false;
 if(r.error){const m=ordMsg(r.error);if(m){msg={e:1,m};return render()}return fail(r.error)}
 OR=null;await load();ok('Estado actualizado.')}
async function ordNotes(id){if(busy)return;busy=true;const r=await sb.rpc('admin_set_order_notes',{p_order:id,p_notes:$('#oi').value});busy=false;if(r.error)return fail(r.error);OR=null;await load();ok('Observaciones guardadas.')}
function sendWA(f){const d=Object.fromEntries(new FormData(f));open(wl(`Hola Mariel, quiero encargar una pieza personalizada.\nNombre: ${d.n}\nTipo: ${d.t} (x${d.c})\nTemática: ${d.s}\nColores: ${d.co}\nTexto: ${d.tx}\nFecha: ${d.f}\nCorreo: ${d.e}\nDetalle: ${d.d}`),'_blank')}
function render(){const w=sb&&!loaded&&['inicio','tienda','galeria','detalle','sobre','trabajo'].includes(view);$('#app').innerHTML=(loadErr?`<div class="w"><div class="note">${loadErr}</div></div>`:'')+(w?'<div class="w sec"><p class="mut">Cargando…</p></div>':V[view]());nav();if(view==='contacto'&&CFG.contactEnabled&&CFG.turnstileSiteKey&&cts!=='sent')tsInit();if(view==='carrito'&&co==='review'&&ordersOn()&&CFG.turnstileSiteKey)tsInit()}
render();init();
</script></body></html>
